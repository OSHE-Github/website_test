### GENERAL SETTINGS ###

# Site settings
title: OSHE
description: "Digital Home of the Open Source Hardware Enterprise"
analytics: #Google analytics code in the format XX-nnnnnnnn-n
baseurl: "/" #important: start with /
url: "https://oshe.io"

# Build settings
markdown: kramdown
permalink: /:categories/:title/
excerpt_separator: <!--more--> #use this in posts to define how long the excerpt of the post (that is shown on the Blog page) is

colors:  #in hex code if not noted else
  primary: "#F5C734" #"#F70031"
  primary_rgb: "245, 199, 52" #"247,0,49" #rgb of the primary. Needed in some places for the transparency effect.
  secondary: "#ffffff" #"#33004D"
  link: "#F5C734"
  link_hover: "#ffcd00"
  footer_heading: "#000000"
  footer_content: "#000000"

# Making projects separate from posts
collections:
  projects:
    output: true
    permalink: /projects/:title/
  questions:
    output: true
    permalink: /questions/:title/

