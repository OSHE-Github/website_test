---
deployment:
  tasks:
    # Set path variables
    - export DEPLOYPATH=/itss/home/openhard/public_html
    - export RUBYVENVPATH=/itss/home/openhard/rubyvenv/ruby/3.4/bin/activate
    # Move repo to path
    - /bin/cp -R * $DEPLOYPATH
    # Activate ruby virtual environment
    - source $RUBYVENVPATH
    # Move into git repo
    - cd $DEPLOYPATH
    # Build the files in the repo using jekyll
    - /itss/home/openhard/rubyvenv/ruby/3.4/bin/jekyll build
